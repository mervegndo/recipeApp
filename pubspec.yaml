name: recipe_app
description: A recipe sharing mobile application with Firebase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^7.2.1
  google_fonts: ^6.1.0
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  # UI & utilities
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  shared_preferences: ^2.5.5
  http: ^1.2.0
  intl: ^0.19.0
  translator: ^1.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/gustoappicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FF6B35"
  image: assets/images/recipeapplogo_white.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/